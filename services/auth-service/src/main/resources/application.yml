spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://localhost:5433/auth_db
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
        ddl-auto: validate
    properties:
        hibernate:
          dialect: org.hibernate.dialect.postgreSQLDialect
    show-sql: false

  security:
    oauth2:
      resourceserver:
        jwt:
           issuer-uri: http://localhost:9090/realms/fintrack360

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

    topics:
      company-registration: company.registration

keycloak:
  auth-server-url: http://localhost:9090
  realm: fintrack360
  admin:
    client-id: fintrack360-backend
    client-secret: MqJf6zD8lsUa58DNtJwqRfDX7nnFBX7z
    username: admin
    password: admin12

server:
  port: 8081

logging:
  level:
    com.fintrack360: DEBUG