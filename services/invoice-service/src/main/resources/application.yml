spring:
  application:
    name: invoice-service

  datasource:
    url: jdbc:postgresql://localhost:5436/invoice_db
    username: fintrack360
    password: fintrack360_pass

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9090/realms/fintrack360

  kafka:
    bootstrap-servers: localhost:9093
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

  flyway:
    enabled: true
    locations: classpath:db/migration

kafka:
  topics:
    invoice-status-changed: invoice.status.changed

server:
  port: 8084

logging:
  level:
    com.fintrack: DEBUG