spring:
  application:
    name: company-service

  datasource:
    url: jdbc:postgresql://localhost:5434/company_db
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9090/realms/fintrack360


server:
  port: 8082

logging:
  level:
    com.fintrack360: DEBUG