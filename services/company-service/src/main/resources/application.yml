spring:
  application:
    name: company-service

  datasource:
    url: jdbc:postgresql://localhost:5434/company_db
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9090/realms/fintrack360


  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: company-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.fintrack.*"
        spring.json.value.default.type: "com.fintrack.Kafka.consumer.CompanyRegistrationEvent"

    kafka:
      topics:
        company-registration: company.registration

server:
  port: 8082

logging:
  level:
    com.fintrack360: DEBUG