spring:
  application:
    name: company-service

  datasource:
    url: jdbc:postgresql://localhost:5434/company_db
    username: fintrack360
    password: fintrack360_pass

  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    show-sql: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9090/realms/fintrack360

  kafka:
    bootstrap-servers: localhost:9093
    consumer:
      group-id: company-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.fintrack.*"
        spring.json.value.default.type: "com.fintrack.company_service.kafka.consumer.CompanyRegistrationEvent"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

kafka:
  topics:
    company-registration: company.registration

server:
  port: 8082

logging:
  level:
    com.fintrack: DEBUG