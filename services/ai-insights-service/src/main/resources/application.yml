spring:
  application:
    name: ai-insights-service

  datasource:
    url: jdbc:postgresql://localhost:5438/ai_db
    username: fintrack360
    password: fintrack360_pass

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9090/realms/fintrack360

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: localhost:9092

server:
  port: 8086

logging:
  level:
    com.fintrack: DEBUG