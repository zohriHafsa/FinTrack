spring:
  application:
    name: gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9090/realms/fintrack360
          jwk-set-uri: http://localhost:9090/realms/fintrack360/protocol/openid-connect/certs

  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4200"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true

      
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**

        - id: company-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/companies/**

        - id: transaction-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/transactions/**

        - id: invoice-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/invoices/**

        - id: budget-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/budgets/**,/api/notifications/**,/api/alert-preferences/**

        - id: ai-insights-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/insights/**

server:
  port: 8080

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: DEBUG