spring:
  application:
    name: gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9090/realms/fintrack360

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4200"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**

        - id: company-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/companies/**, /api/clients/**, /api/categories/**

        - id: transaction-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/transactions/**

        - id: invoice-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/invoices/**

        - id: budget-notification-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/budgets/**, /api/notifications/**

        - id: ai-insights-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/insights/**

server:
  port: 8080

logging:
  level:
    com.fintrack360: DEBUG
    org.springframework.cloud.gateway: DEBUG