  auth_db_data:
  company_db_data:
  transaction_db_data:
  invoice_db_data:
  budget_db_data:
  ai_db_data:
  keycloak_data:
  pgadmin_data:
  kafka_data:

networks:
  fintrack360-net:
    driver: bridge