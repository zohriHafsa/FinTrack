#version: "3.9"

services:
  auth-db:
    image: postgres:16
    container_name: auth-db
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: fintrack360
      POSTGRES_PASSWORD: fintrack360_pass
    ports:
      - "5433:5432"
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    networks:
      - fintrack360-net

  company-db:
    image: postgres:16
    container_name: company-db
    environment:
      POSTGRES_DB: company_db
      POSTGRES_USER: fintrack360
