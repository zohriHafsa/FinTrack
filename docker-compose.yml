    ports:
      - "5434:5432"
    volumes:
      - company_db_data:/var/lib/postgresql/data
    networks:
      - fintrack360-net

  transaction-db:
    image: postgres:16
    container_name: transaction-db
    environment:
      POSTGRES_DB: transaction_db
      POSTGRES_USER: fintrack360
      POSTGRES_PASSWORD: fintrack360_pass
    ports:
      - "5435:5432"
    volumes:
      - transaction_db_data:/var/lib/postgresql/data
    networks:
      - fintrack360-net

  invoice-db:
    image: postgres:16
    container_name: invoice-db
    environment:
      POSTGRES_DB: invoice_db
      POSTGRES_USER: fintrack360
      POSTGRES_PASSWORD: fintrack360_pass
    ports:
      - "5436:5432"
    volumes:
      - invoice_db_data:/var/lib/postgresql/data
    networks:
      - fintrack360-net

  budget-db:
    image: postgres:16
    container_name: budget-db
    environment:
      POSTGRES_DB: budget_db
      POSTGRES_USER: fintrack360
      POSTGRES_PASSWORD: fintrack360_pass
    ports:
      - "5437:5432"
    volumes:
      - budget_db_data:/var/lib/postgresql/data
    networks:
      - fintrack360-net

  ai-db:
    image: postgres:16
    container_name: ai-db
    environment:
      POSTGRES_DB: ai_db
      POSTGRES_USER: fintrack360
      POSTGRES_PASSWORD: fintrack360_pass
    ports:
      - "5438:5432"
    volumes:
      - ai_db_data:/var/lib/postgresql/data
    networks:
      - fintrack360-net

  kafka:
    image: apache/kafka:3.7.0
    container_name: fintrack360-kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:9093,CONTROLLER://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - fintrack360-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: fintrack360-kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka
    networks:
      - fintrack360-net

