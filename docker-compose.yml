  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: fintrack360-keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin12
    ports:
      - "9090:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
    networks:
      - fintrack360-net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: fintrack360-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@fintrack360.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - fintrack360-net


