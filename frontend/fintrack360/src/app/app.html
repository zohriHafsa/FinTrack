<div class="app-layout" *ngIf="isAuthenticated; else loginTemplate">
  <app-sidebar></app-sidebar>
  <div class="main-content">
    <app-navbar [pageTitle]="'FinTrack360'"></app-navbar>
    <div class="page-content">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>

<ng-template #loginTemplate>
  <div class="login-screen">
    <h1>FinTrack360</h1>
    <p>Financial management for Moroccan SMEs</p>
    <button class="login-btn" (click)="login()">
      Login with Keycloak
    </button>
  </div>
</ng-template>
